---
name: Build and publish (Maven 3.10)
on:
  push:
    branches:
      - 'main'
      - 'spring-boot-4'
  workflow_dispatch:

jobs:
  build-java-source:
    name: Build jar files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for GitHub Packages
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Build and test
        run: mvn package

      - name: Upload application JAR for container build
        if: vars.APP_JAR_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-jar
          path: target/${{ vars.APP_JAR_NAME }}
          overwrite: true
          retention-days: 3

      - name: Get version from POM
        id: get-version
        run: |
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$version" >> $GITHUB_ENV

      - name: Publish to GitHub Packages
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spring-boot-4' || github.ref_type == 'tag' }}
        run: mvn deploy -DskipTests -Pci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-to-maven-central:
    name: Publish to Maven Central
    needs: build-java-source
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/spring-boot-4' || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Maven 3.10 only sends a server's credentials to the origins tied to its id, and 'central'
      # is tied to repo.maven.apache.org, so snapshot deploys to central.sonatype.com get a 401.
      # Restore id-only matching until setup-java releases mvn-server-repository-origins
      # (actions/setup-java#1282), then replace this with that input.
      MAVEN_ARGS: -Dmaven.repository.credentialScope=id
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java environment for Maven Central
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish release to Maven Central
        run: mvn deploy -DskipTests -Pci,publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}